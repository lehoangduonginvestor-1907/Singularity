<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
      .dust-container {
        transform-origin: 200px 200px;
        animation: spin 20s linear infinite;
      }
      .black-hole-group {
        transform-origin: 200px 200px;
        animation: pulse 6s ease-in-out infinite;
      }
    </style>

    <!-- Heavy volumetric glow -->
    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft hot glow -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff003c" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#88001b" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#ffb3c1" stop-opacity="1" />
      <stop offset="78%" stop-color="#cc002c" stop-opacity="0.8" />
      <stop offset="90%" stop-color="#ff003c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#88001b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#88001b" stop-opacity="0" />
      <stop offset="15%" stop-color="#ff003c" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#cc002c" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffb3c1" stop-opacity="1" />
      <stop offset="65%" stop-color="#cc002c" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#ff003c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#88001b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Blackout to ensure pure dark compatibility -->
  <rect width="100%" height="100%" fill="#000000" />

  <!-- Animated Black Hole Group -->
  <g class="black-hole-group" style="filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.95))">
    <!-- 1. Volumetric Ambient Glow -->
    <circle cx="200" cy="200" r="180" fill="url(#spaceGlow)" />

    <!-- 2. Lensed Back Accretion Disk (Vertical Ring) -->
    <g transform="rotate(-8 200 200)">
      <ellipse cx="200" cy="200" rx="112" ry="132" fill="none" stroke="url(#ringGrad)" stroke-width="16" filter="url(#heavyGlow)" opacity="0.8" />
      <ellipse cx="200" cy="200" rx="104" ry="122" fill="none" stroke="#ffb3c1" stroke-width="2.5" filter="url(#softGlow)" opacity="0.95" />
    </g>

    <!-- 3. Event Horizon (Solid Black Core) -->
    <circle cx="200" cy="200" r="82" fill="#000000" />

    <!-- 4. Einstein Ring Inner Highlights -->
    <circle cx="200" cy="200" r="83" fill="none" stroke="#ffb3c1" stroke-width="1.5" filter="url(#softGlow)" opacity="0.85" />
    <circle cx="200" cy="200" r="85" fill="none" stroke="#ff003c" stroke-width="4" filter="url(#heavyGlow)" opacity="0.65" />

    <!-- 5. Front Accretion Disk (Passes in front of the black hole) -->
    <g transform="rotate(-8 200 200)">
      <path d="M 30,205 Q 200,225 370,205 Q 200,195 30,205 Z" fill="url(#diskGrad)" filter="url(#heavyGlow)" opacity="0.95" />
      <path d="M 45,205 Q 200,220 355,205" fill="none" stroke="#ffb3c1" stroke-width="2.5" filter="url(#softGlow)" opacity="0.9" />
    </g>
  </g>

  <!-- 6. Orbiting dust/particles -->
  <g class="dust-container" transform="rotate(-8 200 200)">
    <circle cx="60" cy="60" r="1.5" fill="#ffb3c1" opacity="0.6" filter="url(#softGlow)" />
    <circle cx="340" cy="320" r="2" fill="#ff003c" opacity="0.4" filter="url(#heavyGlow)" />
    <circle cx="50" cy="240" r="1" fill="#cc002c" opacity="0.5" />
    <circle cx="320" cy="80" r="1.5" fill="#ffb3c1" opacity="0.7" />
  </g>
</svg>
