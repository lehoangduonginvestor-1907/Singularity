<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Singularity · Scanning</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Roboto+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="singularity.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #e6e8ee; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; min-height: 100vh; overflow: hidden; }
  * { box-sizing: border-box; }

  /* Animations */
  @keyframes disk-rotate { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  @keyframes garg-spin { from { transform: translate(-50%,-50%) rotate(0); } to { transform: translate(-50%,-50%) rotate(360deg); } }
  @keyframes garg-spin-rev { from { transform: translate(-50%,-50%) rotate(0); } to { transform: translate(-50%,-50%) rotate(-360deg); } }
  @keyframes garg-spin-tilt { from { transform: translate(-50%,-50%) rotate(-8deg); } to { transform: translate(-50%,-50%) rotate(352deg); } }
  @keyframes garg-pulse { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
  @keyframes garg-breathe { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.04); } }
  @keyframes garg-entrance { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.4); filter: blur(40px); } 100% { opacity: 1; transform: translate(-50%,-50%) scale(1); filter: blur(0); } }
  @keyframes garg-exit { 0% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0); filter: blur(0); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.6) rotate(180deg); filter: blur(30px); } }
  @keyframes line-in { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes typing { from { width: 0; } to { width: 100%; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes drift-stars { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  @keyframes prog-ring { from { stroke-dashoffset: 565; } to { stroke-dashoffset: 0; } }

  .red-mode { filter: hue-rotate(-30deg) saturate(1.4) brightness(0.95); }

  /* Cursor blinker for typing */
  .cursor-blink { display: inline-block; width: 8px; height: 14px; background: currentColor; vertical-align: -2px; margin-left: 4px; animation: blink 1s steps(2) infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="gargantua.jsx"></script>
<script type="text/babel" src="scanning.jsx"></script>
<script type="text/babel" src="scanning-app.jsx"></script>
</body>
</html>
